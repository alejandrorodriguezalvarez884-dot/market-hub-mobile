<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="art.css">
<!-- The product page's header, 3840 by 1646: one idea, kept to the middle, since the store lays
     the app's own name and buttons over a picture like this one and crops its edges. -->
<style>
  body { display: grid; place-items: center; }
  main { text-align: center; }
  .brand { justify-content: center; font-size: 96px; color: var(--ink); }
  h1 { font-size: 300px; margin-top: 70px; }
  .sub { font-size: 104px; margin-top: 56px; }
  /* The mark's own line, across the picture: the zero everything is measured from. */
  .rule { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); z-index: -1; }
</style>
<body>
  <main>
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 2v16M4 10h8"/><circle cx="14.5" cy="10" r="2.75" fill="currentColor" stroke="none"/></svg>
      <span>Market Hub</span>
    </div>
    <h1>Your stocks, described.</h1>
    <p class="sub">What they are worth, how they moved, how they stand.</p>
  </main>
</body>
